name: Feature request
description: Suggest an improvement to the skill
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea to make urleval more useful? Describe the problem you're running into and what you'd like the skill to do.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into?
      description: Describe the situation where the skill falls short
      placeholder: e.g. "When I have more than 5 candidates, the report gets unwieldy because..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like the skill to do?
      description: Describe the behavior you want
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Other ways to solve the problem, or workarounds you've tried

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, screenshots, or anything else helpful
